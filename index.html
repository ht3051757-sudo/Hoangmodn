<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06030d"><title>AURA • Daily Key</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="particles"></canvas><div class="aurora a1"></div><div class="aurora a2"></div><div class="noise"></div>
<header><div class="brand">AURA</div><nav>
<button onclick="show('home')">TRANG CHỦ</button><button onclick="show('auth')">TÀI KHOẢN</button><button onclick="show('admin')">ADMIN</button>
</nav></header>
<main>
<section id="home" class="page active"><div class="hero reveal">
<div class="badge">✦ DAILY KEY SYSTEM</div><h1>AURA</h1><p>DAILY KEY • NEON • HOLOGRAPHIC EXPERIENCE</p>
<div class="live"><span></span> <b id="onlineCount">0</b> người đang dùng</div>
<div class="actions"><button class="primary magnetic" onclick="claimKey()">⚡ NHẬN KEY HÔM NAY</button><button onclick="show('auth')">ĐĂNG KÝ / ĐĂNG NHẬP</button></div>
<div id="keyBox" class="keybox hidden"></div>
</div></section>

<section id="auth" class="page"><div class="card">
<h2>Tài khoản</h2><input id="username" placeholder="Tên tài khoản"><input id="password" type="password" placeholder="Mật khẩu">
<div class="row"><button class="primary" onclick="register()">TẠO TÀI KHOẢN</button><button onclick="login()">ĐĂNG NHẬP</button></div><p id="authMsg"></p>
</div></section>

<section id="admin" class="page"><div class="card adminCard">
<h2>Hoàng <span class="adminTag">ADMIN</span></h2>
<div id="adminLogin"><p>Đăng nhập khu vực quản trị.</p><input id="adminPass" type="password" placeholder="Mật khẩu Admin"><button class="primary" onclick="adminLogin()">VÀO ADMIN</button></div>
<div id="adminPanel" class="hidden">
<div class="stats"><div><b id="statUsers">0</b><small>Tài khoản</small></div><div><b id="statOnline">0</b><small>Đang dùng</small></div><div><b id="statBanned">0</b><small>Đã BAN</small></div><div><b id="statKeys">0</b><small>KEY</small></div></div>
<hr>
<h3>🔑 Thêm KEY</h3>
<div class="keyForm"><input id="newKey" placeholder="Tên/key, ví dụ AURA-VIP-001"><input id="keyDate" type="date"><input id="keyLimit" type="number" min="1" placeholder="Số lượt"><button class="primary" onclick="addKey()">THÊM KEY</button></div>
<div id="keyList"></div>
<hr><h3>👥 Người dùng</h3><div id="users"></div>
</div></div></section>
</main>
<div id="toast"></div><script src="app.js"></script>
</body></html>
